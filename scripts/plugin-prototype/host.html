<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>aTerm Plugin Prototype</title>
<style>
  :root { color-scheme: light dark; font: menu; }
  body { display: grid; grid-template-columns: 1fr 1fr; margin: 0; min-height: 100vh; }
  main { padding: 16px; }
  h1 { font-size: 16px; font-weight: 600; }
  iframe { border: 0; border-inline-start: 1px solid GrayText; width: 100%; height: 100%; box-sizing: border-box; }
</style>
<main><h1>Server resources prototype</h1><p id="status" role="status">Loading plugin</p></main>
<section id="details" aria-label="Resource details"></section>
<script>
async function verify() {
  const status = document.getElementById('status')
  for (let step = 0; step < 2; step++) {
    const response = await fetch('/next', {cache: 'no-store'})
    if (!response.ok) throw Error('Sample unavailable')
    const {version, snapshot, url, command} = await response.json()
    status.textContent = 'Package ' + version + ' · Worker ' + snapshot.pid
    const frame = document.createElement('iframe')
    frame.title = 'Resource details'
    frame.sandbox = 'allow-scripts'
    frame.src = url
    const channel = new MessageChannel()
    const report = new Promise(resolve => {
      channel.port1.onmessage = ({data}) => {
        if (data.type === 'command' && data.id === command) {
          channel.port1.postMessage({type: 'snapshot', snapshot})
        }
        if (data.type === 'rendered') resolve(data)
      }
    })
    function connect(event) {
      if (event.source !== frame.contentWindow || event.origin !== 'null' || event.data !== 'detail-ready') return
      window.removeEventListener('message', connect)
      frame.contentWindow.postMessage('initialize', '*', [channel.port2])
    }
    window.addEventListener('message', connect)
    document.getElementById('details').replaceChildren(frame)
    const rendered = await report
    channel.port1.close()
    const result = await fetch('/result', {method: 'POST', body: JSON.stringify(rendered)})
    if (!result.ok) throw Error('Result rejected')
  }
}
verify().catch(error => { document.getElementById('status').textContent = error.message })
</script>
</html>
