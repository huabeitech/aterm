<style>
#aterm-tunnels-v3 { --app-bg:light-dark(#fff,#1f1f1f); --app-side:light-dark(#fff,#242424); --app-soft:light-dark(#f8f8fa,#2a2a2c); --app-text:light-dark(#29292d,#eeeeef); --app-muted:light-dark(#737782,#a4a5ac); --app-line:light-dark(#e5e5e9,#3e3e42); --app-blue:light-dark(#2878f5,#4389ef); --app-picked:light-dark(#eaf1fe,#2b3e5b); --app-good:light-dark(#33804c,#8acb99); --app-bad:light-dark(#b94235,#ed998f); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--app-text); color-scheme:light dark; }

#aterm-tunnels-v3 .localcol { width:22% }
#aterm-tunnels-v3 .servicecol { width:21% }

#aterm-tunnels-v3 .dot { width:6px; height:6px; border-radius:50%; background:var(--app-muted); flex-shrink:0 }

#aterm-tunnels-v3 .state.error .dot { background:var(--app-bad) }

#aterm-tunnels-v3 details { font-size:12px; margin-top:4px }
#aterm-tunnels-v3 summary { color:var(--app-muted); cursor:default }
#aterm-tunnels-v3 details .field { margin-top:12px }
#aterm-tunnels-v3 .form-error { color:var(--app-bad); font-size:12px; margin:0 }
#aterm-tunnels-v3 .inline-error { font-size:12px; color:var(--app-bad); display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--app-line); flex-wrap:wrap }
#aterm-tunnels-v3 .quiet { color:var(--app-muted) }
#aterm-tunnels-v3 .terminal { padding:12px; font:12px/1.7 ui-monospace,SFMono-Regular,monospace; white-space:pre-wrap }
#aterm-tunnels-v3 .prompt { color:var(--app-good) }
#aterm-tunnels-v3 .files { padding:12px; font-size:12px }
#aterm-tunnels-v3 .empty { display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:64px 16px; font-size:12px; color:var(--app-muted) }
#aterm-tunnels-v3 .foot-status { padding:6px 16px; color:var(--app-muted); font-size:12px; border-top:1px solid var(--app-line) }
#aterm-tunnels-v3 .announce { font-size:12px; color:var(--app-muted); min-height:20px; padding-top:8px }
#aterm-tunnels-v3 [hidden] { display:none!important }
@media(max-width:820px) { #aterm-tunnels-v3 .shell{grid-template-columns:180px minmax(0,1fr)} #aterm-tunnels-v3 .servicecol{display:none} #aterm-tunnels-v3 .namecol{width:32%} #aterm-tunnels-v3 .localcol{width:30%} #aterm-tunnels-v3 .statuscol{width:20%} #aterm-tunnels-v3 .actioncol{width:18%} #aterm-tunnels-v3 td,#aterm-tunnels-v3 th{padding:10px 8px} }
@media(max-width:580px) { #aterm-tunnels-v3 .sidebar{display:none} #aterm-tunnels-v3 .shell{grid-template-columns:minmax(0,1fr)} #aterm-tunnels-v3 .review{padding-right:0} #aterm-tunnels-v3 .dialog-head,#aterm-tunnels-v3 .dialog-foot{padding:12px 16px} #aterm-tunnels-v3 .form{padding:16px} #aterm-tunnels-v3 .field{grid-template-columns:84px minmax(0,1fr);gap:8px} #aterm-tunnels-v3 .bottom button{padding:8px} #aterm-tunnels-v3 .lights{margin-right:0} #aterm-tunnels-v3 .titlebar{gap:8px} }
@media(pointer:coarse) { #aterm-tunnels-v3 .rowaction,#aterm-tunnels-v3 .button{min-height:40px} #aterm-tunnels-v3 input,#aterm-tunnels-v3 select{min-height:36px} }
</style>
<div id="aterm-tunnels-v3">
 <div class="review"><label for="at3-review">查看</label><select id="at3-review"><option value="list">隧道列表</option><option value="create">新建隧道</option><option value="private">访问其他内网主机</option><option value="error">端口占用</option><option value="global">全部隧道</option></select></div>
 <div class="window">
  <div class="titlebar"><div class="lights" aria-hidden="true"><span></span><span></span><span></span></div><span class="chrome-icon" aria-hidden="true"><i data-lucide="panel-left"></i></span><div class="workspace-tab"><i data-lucide="terminal" aria-hidden="true"></i><span id="at3-workspace">prod-app</span><span class="x" aria-hidden="true">×</span></div><span class="chrome-icon" aria-hidden="true"><i data-lucide="plus"></i></span><span class="chrome-icon top-search" aria-hidden="true"><i data-lucide="search"></i></span></div>
  <div class="shell">
   <aside class="sidebar" aria-label="Connections">

    <div class="tree"><div class="folder"><i data-lucide="chevron-down" aria-hidden="true"></i><i data-lucide="folder-open" aria-hidden="true"></i>Production</div><button type="button" class="host active" data-action="host"><i data-lucide="server" aria-hidden="true"></i>prod-app</button><div class="host"><i data-lucide="server" aria-hidden="true"></i>bastion</div><div class="host"><i data-lucide="server" aria-hidden="true"></i>prod-db</div><div class="folder"><i data-lucide="chevron-down" aria-hidden="true"></i><i data-lucide="folder-open" aria-hidden="true"></i>Development</div><div class="host"><i data-lucide="server" aria-hidden="true"></i>dev</div><div class="host"><i data-lucide="server" aria-hidden="true"></i>ubuntu</div><div class="host"><i data-lucide="server" aria-hidden="true"></i>staging</div></div>
    <div class="sidebar-footer"><span class="settings"><i data-lucide="settings" aria-hidden="true"></i>Settings</span><button class="chrome-icon" type="button" data-action="global" aria-label="All tunnels" data-tooltip="All tunnels"><i data-lucide="cable" aria-hidden="true"></i></button><span class="chrome-icon" aria-hidden="true"><i data-lucide="cloud-upload"></i></span><span class="chrome-icon" aria-hidden="true"><i data-lucide="upload"></i></span></div>
   </aside>
   <div class="content"><div class="toolbar" id="at3-toolbar"></div><main class="list" id="at3-main"></main><div id="at3-bottom"></div></div>
  </div>

<script>
(function(){
 const root=document.getElementById('aterm-tunnels-v3');
 const $=selector=>root.querySelector(selector);
 const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
 const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const rows=[{id:'db',name:'Production database',type:'MySQL',host:'prod-app',local:'13306',port:'3306',location:'same',address:'',running:true},{id:'cache',name:'Application cache',type:'Redis',host:'prod-app',local:'16379',port:'6379',location:'same',address:'',running:false},{id:'web',name:'Internal dashboard',type:'Web service',host:'bastion',local:'18080',port:'8080',location:'private',address:'dashboard.internal',running:false}];
 const state={view:'Tunnels',screen:'list',global:false,editing:null,draft:null,error:false};
 const initial=window.openai?.widgetState?.modelContent;
 const known=['list','create','private','error','global'];
 const defaults=()=>({name:'',type:'MySQL',host:'prod-app',local:'13307',port:'3306',location:'same',address:'',running:false});
 function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'aTerm existing layout',screen:state.screen,bottomTab:state.view},privateContent:{}}).catch(()=>{});}
 function announce(message){$('#at3-announce').textContent=message;}
 function button(label,action,primary=false){return '<button type="button" class="button'+(primary?' primary':'')+'" data-action="'+action+'">'+label+'</button>';}
 function action(label,actionName,iconName,disabled=false){return '<button type="button" class="rowaction" aria-label="'+escape(label)+'" data-tooltip="'+escape(label)+'" data-action="'+actionName+'"'+(disabled?' disabled':'')+'>'+icon(iconName)+'</button>';}
 function status(row){return '<span class="state '+(row.running?'running':'')+'"><span class="dot"></span>'+(row.running?'Running':'Stopped')+'</span>';}
 function render(){
  const shown=state.global?rows:rows.filter(row=>row.host==='prod-app');
  $('#at3-review').value=state.screen;
  $('#at3-workspace').textContent=state.global?'Tunnels':'prod-app';
  const tunnels=state.view==='Tunnels'||state.global;
  $('#at3-toolbar').hidden=!tunnels;
  $('#at3-toolbar').innerHTML='<h2>'+(state.global?'All tunnels':'Tunnels')+'</h2>'+button(icon('plus')+' New tunnel','new');
  if(tunnels){
   const error=state.error?'<div class="inline-error" role="alert">'+icon('circle-alert')+'<span>Port 13306 is in use.</span>'+button('Use 13307','fix-port')+'</div>':'';
   $('#at3-main').innerHTML=error+'<table><thead><tr><th class="namecol">Name</th><th class="localcol">Local address</th><th class="servicecol">Service</th><th class="statuscol">Status</th><th class="actioncol"></th></tr></thead><tbody>'+shown.map(row=>'<tr><td>'+escape(row.name)+(state.global?'<small>'+escape(row.host)+'</small>':'')+'</td><td>127.0.0.1:'+escape(row.local)+'</td><td class="servicecol">'+escape(row.location==='same'?'This host':row.address)+':'+escape(row.port)+'</td><td>'+status(row)+'</td><td><div class="rowactions">'+action((row.running?'Stop ':'Start ')+row.name,'toggle:'+row.id,row.running?'square':'play')+action('Edit '+row.name,'edit:'+row.id,'pencil')+action('Copy address for '+row.name,'copy:'+row.id,'copy',!row.running)+'</div></td></tr>').join('')+'</tbody></table>';
  }else if(state.view==='Terminal')$('#at3-main').innerHTML='<div class="terminal"><span class="prompt">➜</span>  ~ <span class="quiet">▏</span></div>';
  else if(state.view==='Files')$('#at3-main').innerHTML='<div class="files quiet">/home/deploy</div><table><thead><tr><th>Name</th><th>Size</th><th>Modified</th></tr></thead><tbody><tr><td>apps</td><td>—</td><td>Nov 17</td></tr><tr><td>logs</td><td>—</td><td>Nov 17</td></tr></tbody></table>';
  else $('#at3-main').innerHTML='<div class="empty">No containers</div>';
  $('#at3-bottom').innerHTML=state.global?'<div class="foot-status">'+rows.length+' tunnels</div>':'<div class="bottom" role="tablist" aria-label="Connection views">'+[['Terminal','terminal'],['Files','folder-open'],['Tunnels','cable'],['Docker','box']].map(([label,symbol])=>'<button type="button" role="tab" aria-selected="'+(state.view===label)+'" data-action="view:'+label+'">'+icon(symbol)+label+'</button>').join('')+'</div>';
  const d=state.draft;
  $('#at3-modal').innerHTML=d?'<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="at3-dialog-title"><div class="dialog-head"><h3 id="at3-dialog-title">'+(state.editing?'Edit tunnel':'New tunnel')+'</h3><button type="button" class="chrome-icon" data-action="cancel" aria-label="Close">'+icon('x')+'</button></div><form id="at3-form" class="form"><div class="field"><label for="at3-name">Name</label><input id="at3-name" data-field="name" required placeholder="Production database" value="'+escape(d.name)+'"></div><div class="field"><label for="at3-type">Service</label><select id="at3-type" data-field="type">'+['MySQL','Redis','Web service','Other TCP'].map(t=>'<option'+(d.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field"><label for="at3-host">SSH host</label><select id="at3-host" data-field="host">'+['prod-app','bastion','prod-db'].map(t=>'<option'+(d.host===t?' selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field"><label for="at3-location">Service location</label><select id="at3-location" data-field="location"><option value="same"'+(d.location==='same'?' selected':'')+'>This SSH host</option><option value="private"'+(d.location==='private'?' selected':'')+'>Another private host</option></select></div>'+(d.location==='private'?'<div class="field"><label for="at3-address">Service address</label><input id="at3-address" data-field="address" required placeholder="db.internal" value="'+escape(d.address)+'"></div>':'')+'<div class="field"><label for="at3-port">Service port</label><input id="at3-port" data-field="port" type="number" required min="1" max="65535" value="'+escape(d.port)+'"></div><div class="field"><label for="at3-local">Local port</label><input id="at3-local" data-field="local" type="number" required min="1" max="65535" value="'+escape(d.local)+'"></div><details><summary>Advanced</summary><div class="field"><label for="at3-listen">Listen address</label><input id="at3-listen" value="127.0.0.1"></div></details><p class="form-error" id="at3-form-error" hidden></p></form><div class="dialog-foot">'+button('Cancel','cancel')+(state.editing&&d.running?'':button('Save','save'))+button(state.editing&&d.running?'Save and restart':'Save and start','start',true)+'</div></section></div>':'';
  if(globalThis.lucide)lucide.createIcons();
 }
 function show(screen,persist=true){state.screen=screen;state.global=screen==='global';state.error=screen==='error';state.view='Tunnels';state.draft=null;state.editing=null;if(screen==='create'||screen==='private'){state.draft=defaults();if(screen==='private'){state.draft.location='private';state.draft.host='bastion';state.draft.name='Internal database';state.draft.address='db.internal';}}announce('');render();if(persist)remember();}
 function save(start){
  const form=$('#at3-form');if(!form.reportValidity())return;
  const d={...state.draft,name:state.draft.name.trim()};
  const conflict=start&&rows.some(row=>row.id!==state.editing&&row.running&&row.local===d.local);
  if(conflict){const e=$('#at3-form-error');e.hidden=false;e.textContent='Port '+d.local+' is in use.';return;}
  d.running=start;
  if(state.editing){const index=rows.findIndex(row=>row.id===state.editing);rows[index]={...d,id:state.editing};}else rows.push({...d,id:'new-'+rows.length});
  const keepGlobal=state.global||d.host!=='prod-app';state.draft=null;state.editing=null;state.global=keepGlobal;state.screen=keepGlobal?'global':'list';render();remember();
 }
 root.addEventListener('click',e=>{
  const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;
  if(a==='new'){state.draft=defaults();state.editing=null;state.screen='create';render();remember();$('#at3-name').focus();return;}
  if(a==='cancel'){state.draft=null;state.editing=null;state.screen=state.global?'global':'list';render();remember();return;}
  if(a==='host'){show('list');return;}
  if(a==='global'){show('global');return;}
  if(a.startsWith('view:')){state.view=a.slice(5);state.screen='list';state.error=false;render();remember();return;}
  if(a.startsWith('toggle:')){const row=rows.find(row=>row.id===a.slice(7));row.running=!row.running;render();remember();return;}
  if(a.startsWith('edit:')){const row=rows.find(row=>row.id===a.slice(5));state.draft={...row};state.editing=row.id;render();$('#at3-name').focus();return;}
  if(a.startsWith('copy:')){const row=rows.find(row=>row.id===a.slice(5));announce('Preview: copy 127.0.0.1:'+row.local);return;}
  if(a==='fix-port'){state.error=false;rows[0].local='13307';rows[0].running=true;state.screen='list';render();remember();return;}
  if(a==='save'||a==='start')save(a==='start');
 });
 root.addEventListener('input',e=>{const field=e.target.dataset.field;if(state.draft&&['name','address','port','local'].includes(field))state.draft[field]=e.target.value;if(e.target.id==='at3-host-search'){const term=e.target.value.toLowerCase();root.querySelectorAll('.host').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(term));}});
 root.addEventListener('change',e=>{
  if(e.target.id==='at3-review'){show(e.target.value);return;}
  const field=e.target.dataset.field;if(!state.draft||!['type','host','location'].includes(field))return;
  state.draft[field]=e.target.value;
  if(field==='type'){const ports={'MySQL':['3306','13307'],'Redis':['6379','16380'],'Web service':['8080','18080'],'Other TCP':['9000','19000']};[state.draft.port,state.draft.local]=ports[state.draft.type];}
  render();
 });
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.draft){state.draft=null;state.editing=null;state.screen=state.global?'global':'list';render();}if(e.key==='Enter'&&e.target.closest('#at3-form')){e.preventDefault();save(false);}});
 root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='at3-form')save(false);});
 window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.modelContent;if(next&&known.includes(next.screen)&&next.screen!==state.screen)show(next.screen,false);});
 if(initial&&known.includes(initial.screen))show(initial.screen,false);else render();
})();
</script>
