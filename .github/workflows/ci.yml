name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Install frontend dependencies
        run: wails3 task frontend:install
      - name: Generate bindings and embedded frontend
        run: |
          wails3 task generate:bindings
          wails3 task frontend:build FRONTEND_DEPS_INSTALLED=true
      - name: Run backend and frontend checks
        run: wails3 task test FRONTEND_DEPS_INSTALLED=true
      # Session snapshots currently return a value containing sync.Mutex.
      # Keep the existing copylocks debt separate; run every other vet analyzer.
      - name: Vet Go packages
        run: python3 scripts/go-macos.py vet -copylocks=false ./...
