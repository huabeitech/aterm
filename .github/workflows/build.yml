name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify build architecture
        run: test "$(uname -m)" = arm64
      - name: Build and verify application
        run: wails3 task build
      - name: Package test application
        id: package
        shell: bash
        run: |
          app_name="$(python3 scripts/sync-build-metadata.py --print-field productName)"
          archive="${app_name}-macos-arm64-${GITHUB_SHA:0:12}.zip"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "build/bin/${app_name}.app" "build/artifacts/${archive}"
          (cd build/artifacts && shasum -a 256 "$archive" > "$archive.sha256")
          echo "name=${archive%.zip}" >> "$GITHUB_OUTPUT"
          echo "### macOS test build" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact below. This ad-hoc signed test build is not notarized and may be blocked by Gatekeeper.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
